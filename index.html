<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIGO Showroom - Plataformas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--text:#0a0a0a;--muted:#6b7280;--line:#eaeaec;--card:#ffffff;--soft:#f6f6f7;--black:#0a0a0a}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:20px;letter-spacing:-0.8px} .logo i{font-style:normal;color:#f59e0b}
.searchWrap{display:flex;gap:12px;align-items:center}
.search{width:360px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:14px}
.iconBtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:white;display:grid;place-items:center;cursor:pointer}
.iconBtn:hover{background:var(--black);color:white}
.hero{max-width:1200px;margin:0 auto;padding:48px 24px 10px;text-align:center}
.hero h1{font-size:48px;line-height:0.9;letter-spacing:-2.5px;font-weight:800} .hero p{color:var(--muted);max-width:540px;margin:14px auto 22px;font-size:15px;line-height:1.6}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)} .chip.active{background:var(--black);color:white;border-color:var(--black)}
.grid{max-width:1200px;margin:0 auto;padding:24px 20px 100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.25s}
.card:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(0,0,0,.08);border-color:#d1d1d6}
.thumb{height:200px;background:#f3f3f5;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:14px;left:14px;background:white;border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.4px}
.content{padding:18px}
.content h3{font-size:18px;letter-spacing:-0.4px;margin-bottom:6px} .content p{color:var(--muted);font-size:13px;line-height:1.5;height:40px;overflow:hidden}
.price{font-size:14px;font-weight:700;margin:12px 0 6px} .price span{color:var(--muted);font-weight:500}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}
.meta i{font-style:normal;font-size:11px;background:var(--soft);border:1px solid var(--line);padding:5px 10px;border-radius:999px;color:#3f3f46}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:46px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-view{background:white;color:var(--black)} .btn-view:hover{background:var(--soft)}
.btn-quote{background:var(--black);color:white;border-color:var(--black)} .btn-quote:hover{background:#1a1a1a}
.adminFab{position:fixed;right:20px;bottom:20px;z-index:30;background:var(--black);color:white;border:0;padding:14px 18px;border-radius:16px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 12px 24px rgba(0,0,0,.2);cursor:pointer}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,10,10,.45);backdrop-filter:blur(10px);display:none;z-index:60;padding:20px;align-items:center;justify-content:center}
.box{width:100%;max-width:900px;background:white;border-radius:24px;border:1px solid var(--line);overflow:hidden;max-height:90vh;display:flex;flex-direction:column}
.boxHead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.boxBody{overflow:auto}
.split{display:grid;grid-template-columns:1.3fr .7fr} .iframe{width:100%;height:560px;border:0;background:#f9f9f9}
.side{padding:20px;border-left:1px solid var(--line);background:#fcfcfd}
.form{padding:22px;display:grid;gap:14px}
.input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:14px;outline:none}
.input:focus{border-color:var(--black);background:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){.split{grid-template-columns:1fr} .search{width:200px} .hero h1{font-size:34px} .iframe{height:380px}}
</style>
</head>
<body>
<header>
<div class="logo">KIGO <i>SHOWROOM</i></div>
<div class="searchWrap">
<input id="search" class="search" placeholder="Buscar: hotel, recargas, restaurante...">
<button class="iconBtn" onclick="openAdmin()" title="Admin">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20a8 8 0 100-16 8 8 0 000 16z"/><path d="M12 14a2 2 0 100-4 2 2 0 000 4z"/></svg>
</button>
</div>
</header>

<div class="hero">
<h1>Explora. Prueba. Cotiza.</h1>
<p>Todas nuestras plataformas listas para ver en vivo. Entra a la demo real y cotiza en segundos.</p>
<div class="filters" id="filters"></div>
</div>

<div class="grid" id="grid"></div>

<button class="adminFab" onclick="openAdmin()">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
ADMINISTRADOR
</button>

<!-- MODAL VER -->
<div class="modal" id="viewModal">
<div class="box">
<div class="boxHead"><b id="vTitle">Demo</b><button class="iconBtn" onclick="closeView()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
<div class="split">
<iframe id="vFrame" class="iframe"></iframe>
<div class="side">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><div style="width:36px;height:36px;border-radius:10px;background:black;color:white;display:grid;place-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div><div><div style="font-weight:700" id="vName">KIGO HOTEL</div><div style="font-size:12px;color:#6b7280" id="vCat">HOTEL</div></div></div>
<p id="vDesc" style="font-size:13px;color:#6b7280;line-height:1.6"></p>
<div style="margin:16px 0;padding:14px;border:1px solid #eaeaec;border-radius:12px;background:white"><div style="font-size:12px;color:#6b7280">PRECIO DESDE</div><div style="font-weight:800;font-size:18px" id="vPrice">$0</div></div>
<button id="vGo" class="btn btn-quote" style="width:100%">Abrir plataforma completa</button>
<button class="btn btn-view" style="width:100%;margin-top:10px" onclick="openQuoteFromView()">Cotizar esta plataforma</button>
</div>
</div>
</div>
</div>

<!-- MODAL COTIZAR -->
<div class="modal" id="quoteModal">
<div class="box" style="max-width:480px">
<div class="boxHead"><b>Cotizar plataforma</b><button class="iconBtn" onclick="closeQuote()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
<div class="form">
<div id="qPlatform" style="font-weight:700"></div>
<input id="qName" class="input" placeholder="Tu nombre">
<input id="qWhats" class="input" placeholder="WhatsApp">
<input id="qEmail" class="input" placeholder="Email empresa">
<textarea id="qMsg" class="input" style="height:90px" placeholder="¿Qué necesitas? Ej: Hotel de 20 habitaciones en Dolores..."></textarea>
<button class="btn btn-quote" onclick="sendQuote()">Enviar cotización por WhatsApp</button>
</div>
</div>
</div>

<!-- MODAL ADMIN -->
<div class="modal" id="adminModal">
<div class="box" style="max-width:720px">
<div class="boxHead"><b>Panel Administrador</b><button class="iconBtn" onclick="closeAdmin()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
<div class="form">
<div class="row"><input id="aName" class="input" placeholder="Nombre: KIGO HOTEL PRO"><input id="aCat" class="input" placeholder="Categoría: hotel / recargas / restaurante / delivery"></div>
<input id="aDesc" class="input" placeholder="Descripción corta">
<input id="aImg" class="input" placeholder="URL de imagen (https://...)">
<input id="aUrl" class="input" placeholder="URL del proyecto real (https://...)">
<div class="row"><input id="aPrice" class="input" placeholder="Precio desde: Ej 499 USD"><input id="aTags" class="input" placeholder="Tags separados por coma: Reservas,Pagos,Admin"></div>
<div style="display:flex;gap:10px"><button class="btn btn-quote" style="flex:1" onclick="savePlatform()">Guardar plataforma</button><button class="btn btn-view" style="flex:1" onclick="clearForm()">Limpiar</button></div>
<div id="adminList" style="margin-top:10px;display:grid;gap:8px"></div>
</div>
</div>
</div>

<script>
let platforms = JSON.parse(localStorage.getItem('kigo_showroom')||'null') || [
{ id:1, cat:'hotel', nombre:'KIGO HOTEL PRO', desc:'Sistema de reservas, pagos y administración hotelera listo para hoteles.', img:'https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=800', url:'https://example.com/hotel', price:'Desde $499 USD', tags:['Reservas','Pagos','Admin'] },
{ id:2, cat:'recargas', nombre:'KIGO RECARGAS', desc:'Recargas Telcel, Bait, Movistar con comisiones automáticas y saldo mayorista.', img:'https://images.unsplash.com/photo-1556742031-c6961e8560b0?q=80&w=800', url:'https://example.com/recargas', price:'Desde $299 USD', tags:['API','SPEI','Comisiones'] },
{ id:3, cat:'restaurante', nombre:'KIGO RESTO QR', desc:'Menú QR, comandas y cocina en tiempo real para restaurantes.', img:'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=800', url:'https://example.com/resto', price:'Desde $349 USD', tags:['QR','Cocina','Delivery'] },
];

let filtro='todo', editingId=null, currentView=null;
const cats=[...new Set(platforms.map(p=>p.cat))];
function save(){ localStorage.setItem('kigo_showroom', JSON.stringify(platforms)); }

function renderFilters(){
 let all=['todo',...new Set(platforms.map(p=>p.cat))];
 document.getElementById('filters').innerHTML=all.map(c=>`<div class="chip ${filtro===c?'active':''}" onclick="setFilter('${c}')">${c.toUpperCase()}</div>`).join('');
}
function setFilter(c){ filtro=c; renderFilters(); renderGrid(); }
function renderGrid(){
 let q=document.getElementById('search').value.toLowerCase();
 let list=platforms.filter(p=> (filtro==='todo'||p.cat===filtro) && (p.nombre.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)));
 document.getElementById('grid').innerHTML=list.map(p=>`
  <div class="card">
   <div class="thumb"><img src="${p.img}" onerror="this.src='https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=800'"><div class="tag">${p.cat.toUpperCase()}</div></div>
   <div class="content">
    <h3>${p.nombre}</h3><p>${p.desc}</p>
    <div class="price">${p.price} <span>• pago único</span></div>
    <div class="meta">${p.tags.map(t=>`<i>${t}</i>`).join('')}</div>
    <div class="actions">
     <button class="btn btn-view" onclick="openView(${p.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Ver</button>
     <button class="btn btn-quote" onclick="openQuote(${p.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg> Cotizar</button>
    </div>
   </div>
  </div>`).join('');
}
function openView(id){
 let p=platforms.find(x=>x.id===id); currentView=p;
 document.getElementById('vTitle').innerText=p.nombre; document.getElementById('vName').innerText=p.nombre; document.getElementById('vCat').innerText=p.cat.toUpperCase(); document.getElementById('vDesc').innerText=p.desc; document.getElementById('vPrice').innerText=p.price;
 document.getElementById('vFrame').src=p.url; document.getElementById('vGo').onclick=()=>window.open(p.url,'_blank');
 document.getElementById('viewModal').style.display='flex';
}
function closeView(){ document.getElementById('viewModal').style.display='none'; document.getElementById('vFrame').src=''; }
function openQuote(id){ let p=platforms.find(x=>x.id===id); document.getElementById('qPlatform').innerText=p.nombre; document.getElementById('quoteModal').style.display='flex'; document.getElementById('quoteModal').dataset.id=id; }
function openQuoteFromView(){ closeView(); openQuote(currentView.id); }
function closeQuote(){ document.getElementById('quoteModal').style.display='none'; }
function sendQuote(){
 let id=document.getElementById('quoteModal').dataset.id; let p=platforms.find(x=>x.id==id);
 let msg=`Hola KIGO, quiero cotizar: ${p.nombre}%0A%0ANombre: ${document.getElementById('qName').value}%0AWhatsApp: ${document.getElementById('qWhats').value}%0AEmail: ${document.getElementById('qEmail').value}%0ADetalle: ${document.getElementById('qMsg').value}%0ALink: ${p.url}`;
 window.open(`https://wa.me/521000000000?text=${msg}`,'_blank');
}
function openAdmin(){ document.getElementById('adminModal').style.display='flex'; renderAdminList(); }
function closeAdmin(){ document.getElementById('adminModal').style.display='none'; }
function clearForm(){ editingId=null; ['aName','aCat','aDesc','aImg','aUrl','aPrice','aTags'].forEach(i=>document.getElementById(i).value=''); }
function savePlatform(){
 let obj={ id:editingId||Date.now(), cat:document.getElementById('aCat').value.toLowerCase()||'general', nombre:document.getElementById('aName').value, desc:document.getElementById('aDesc').value, img:document.getElementById('aImg').value, url:document.getElementById('aUrl').value, price:document.getElementById('aPrice').value, tags:document.getElementById('aTags').value.split(',').map(s=>s.trim()).filter(Boolean) };
 if(!obj.nombre||!obj.url) return alert('Nombre y URL son obligatorios');
 let idx=platforms.findIndex(x=>x.id===obj.id); if(idx>=0) platforms[idx]=obj; else platforms.push(obj);
 save(); renderFilters(); renderGrid(); renderAdminList(); clearForm();
}
function renderAdminList(){
 document.getElementById('adminList').innerHTML=platforms.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #eaeaec;border-radius:12px;padding:10px 12px;background:#fcfcfd"><div style="font-size:13px"><b>${p.nombre}</b><br><span style="color:#6b7280">${p.cat} • ${p.price}</span></div><div style="display:flex;gap:6px"><button class="iconBtn" style="width:36px;height:36px" onclick="editP(${p.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="iconBtn" style="width:36px;height:36px" onclick="delP(${p.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button></div></div>`).join('');
}
function editP(id){ let p=platforms.find(x=>x.id===id); editingId=id; document.getElementById('aName').value=p.nombre; document.getElementById('aCat').value=p.cat; document.getElementById('aDesc').value=p.desc; document.getElementById('aImg').value=p.img; document.getElementById('aUrl').value=p.url; document.getElementById('aPrice').value=p.price; document.getElementById('aTags').value=p.tags.join(', '); }
function delP(id){ if(confirm('Borrar plataforma?')){ platforms=platforms.filter(x=>x.id!==id); save(); renderFilters(); renderGrid(); renderAdminList(); } }
document.getElementById('search').addEventListener('input',renderGrid);
renderFilters(); renderGrid();
</script>
</body>
 </html>
